<!doctype html><meta charset=utf-8><body><script>
window.result = {};
(async () => {
  const r = window.result;
  r.ua = navigator.userAgent;
  r.hasGUM = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  r.hasGDM = !!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia);
  r.RTCPeerConnection = typeof RTCPeerConnection;
  r.RTCRtpScriptTransform = typeof RTCRtpScriptTransform;
  r.createEncodedStreams = typeof (window.RTCRtpSender && RTCRtpSender.prototype.createEncodedStreams);
  r.encodedInsertableStreams = 'n/a';
  try {
    const s = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: true, noiseSuppression: true, autoGainControl: true}, video: {width: 1280, height: 720, frameRate: 30}});
    r.gum = s.getTracks().map(t => t.kind + ':' + t.label + ':' + JSON.stringify(t.getSettings()));
    const pc1 = new RTCPeerConnection({encodedInsertableStreams: true});
    const pc2 = new RTCPeerConnection({encodedInsertableStreams: true});
    pc1.onicecandidate = e => e.candidate && pc2.addIceCandidate(e.candidate);
    pc2.onicecandidate = e => e.candidate && pc1.addIceCandidate(e.candidate);
    let frames = 0;
    pc2.ontrack = (e) => {
      try {
        const {readable, writable} = e.receiver.createEncodedStreams();
        readable.pipeThrough(new TransformStream({transform(f, c) { frames++; c.enqueue(f); }})).pipeTo(writable);
        r.recvEncoded = 'ok';
      } catch (err) { r.recvEncoded = 'err ' + err; }
    };
    for (const t of s.getTracks()) {
      const sender = pc1.addTrack(t, s);
      try { const {readable, writable} = sender.createEncodedStreams(); readable.pipeTo(writable); r.sendEncoded = 'ok'; } catch (err) { r.sendEncoded = 'err ' + err; }
    }
    const o = await pc1.createOffer(); await pc1.setLocalDescription(o); await pc2.setRemoteDescription(o);
    const a = await pc2.createAnswer(); await pc2.setLocalDescription(a); await pc1.setRemoteDescription(a);
    // A slow encoder or ICE setup takes a while on a loaded runner: wait for
    // the frames the test asks for, up to 20 s, and report the count reached.
    const until = Date.now() + 20000;
    while (frames <= 50 && Date.now() < until) await new Promise(res => setTimeout(res, 250));
    r.framesThroughTransform = frames;
    // Why frames might not flow: the connection, and what the sender encoded.
    r.ice = [pc1.iceConnectionState, pc2.iceConnectionState, pc1.connectionState, pc2.connectionState];
    r.encoded = {};
    try {
      for (const st of await pc1.getStats()) {
        if (st.type === 'outbound-rtp') r.encoded[st.kind] = { frames: st.framesEncoded ?? null, packets: st.packetsSent };
        if (st.type === 'candidate-pair' && st.state === 'succeeded') r.pair = st.id;
      }
    } catch (err) { r.statsErr = String(err); }
    r.codecs = RTCRtpSender.getCapabilities('video').codecs.map(c => c.mimeType).filter((v,i,a)=>a.indexOf(v)===i);
    r.audioCodecs = RTCRtpSender.getCapabilities('audio').codecs.map(c => c.mimeType).filter((v,i,a)=>a.indexOf(v)===i);
  } catch (e) { r.err = String(e); }
  try { const d = await navigator.mediaDevices.getDisplayMedia({video: true, audio: true}); r.gdm = d.getTracks().map(t => t.kind + ':' + t.label); }
  catch (e) { r.gdmErr = String(e); }
  r.done = true;
})();
</script>
