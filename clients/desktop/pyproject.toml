[project]
name = "openarcanum"
version = "2026.10.8"
description = "OpenArcanum desktop client: private community chat (pywebview)"
license = "AGPL-3.0-only"
readme = "README.md"
# Tested on 3.14 only (.python-version). 3.15's lazy imports break inside
# the Qt process: concurrent.futures.ThreadPoolExecutor stays an unresolved
# `lazy_import` object, so the first thread-pool call fails.
requires-python = ">=3.14,<3.15"
dependencies = [
    "cryptography>=50.0.2",
    "jeepney>=0.9 ; sys_platform == 'linux'",
    "keyring>=25",
    "platformdirs>=4.13.5",
    # Keep on the same major as `protoc --version` (libprotoc 36 -> protobuf 7.36).
    "protobuf>=7.36,<7.37",
    "pyside6>=6.11.0",
    "pywebview>=6.2.1",
    "qtpy>=2.4.3",
    "spake2==0.9",
    "vodozemac==0.10.0",
    "websockets>=17.3",
]

[project.scripts]
openarcanum = "openarcanum:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.9",
    "pip-audit>=2.10.1",
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 120
target-version = "py314"
# wire/: generated by `make proto`. _vendor/: third-party code kept as close to
# upstream as possible (local changes are listed in _vendor/noise/VENDORED.md),
# so it is neither linted nor reformatted; tests/test_noise_vectors.py covers it.
extend-exclude = ["src/openarcanum/wire", "src/openarcanum/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM105", "B904"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
