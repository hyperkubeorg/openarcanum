# Drop-in: keep the community storage key outside the data directory.
#
#   install -d -m 0700 /etc/openarcanum/credentials
#   mv /var/lib/openarcanum-community/storage.key /etc/openarcanum/credentials/community-storage.key
#   install -D -m 0644 openarcanum-community-storage-key.conf \
#       /etc/systemd/system/openarcanum-community.service.d/storage-key.conf
#   systemctl daemon-reload && systemctl restart openarcanum-community
#
# systemd hands the key to the service as a credential (readable only by
# the service, in memory, for as long as it runs); the environment variable
# overrides storage_key_file in config.json. Back the key up separately:
# backups can't be read without it.

[Service]
LoadCredential=storage.key:/etc/openarcanum/credentials/community-storage.key
Environment=OPENARCANUM_COMMUNITY_STORAGE_KEY_FILE=%d/storage.key
