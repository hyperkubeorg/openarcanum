<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1090" viewBox="0 0 1240 1090" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>Community chat: trust zones and traffic</title>
  <defs>
    <marker id="hBlue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker>
    <marker id="tBlue" viewBox="0 0 10 10" refX="1" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2563EB"/></marker>
    <marker id="hPink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#DB2777"/></marker>
    <marker id="tPink" viewBox="0 0 10 10" refX="1" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#DB2777"/></marker>
    <marker id="hPurple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker>
    <marker id="tPurple" viewBox="0 0 10 10" refX="1" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7C3AED"/></marker>
    <marker id="hGray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
    <g id="key">
      <circle cx="-5" cy="0" r="4.5" fill="none" stroke="#D97706" stroke-width="2.2"/>
      <path d="M-0.5,0 H10 M7,0 V4 M10,0 V4" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round"/>
    </g>
  </defs>

  <style>
    .title { font-size: 24px; font-weight: 700; fill: #0F172A; }
    .sub { font-size: 14px; fill: #475569; }
    .zl { font-size: 13px; font-weight: 700; letter-spacing: 0.6px; }
    .zs { font-size: 12px; fill: #475569; }
    .ct { font-size: 15px; font-weight: 600; fill: #0F172A; }
    .cx { font-size: 12px; fill: #334155; }
    .al { font-size: 11px; font-weight: 600; }
    .lg { font-size: 12px; fill: #334155; }
  </style>

  <rect width="1240" height="1090" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="40" y="48" class="title">Community chat: trust zones and traffic</text>
  <text x="40" y="74" class="sub">Communities can read their own content. Relays and maintainer nodes hold no keys and see only ciphertext.</text>

  <!-- ===================== MAINTAINER NODES ===================== -->
  <rect x="40" y="100" width="1160" height="170" rx="16" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="60" y="127" class="zl" fill="#92400E">MAINTAINER NODES<tspan font-weight="400" letter-spacing="0">  ·  your root node + trusted friends  ·  hold no community or DM keys</tspan></text>

  <rect x="70" y="145" width="260" height="105" rx="10" fill="#FFFFFF" stroke="#FCD34D"/>
  <text x="86" y="175" class="ct">DM mailboxes</text>
  <text x="86" y="200" class="cx">Encrypted DM items, 14 days</text>
  <text x="86" y="220" class="cx">Not replicated: senders write to</text>
  <text x="86" y="240" class="cx">every node, devices read every node</text>

  <rect x="350" y="145" width="260" height="105" rx="10" fill="#FFFFFF" stroke="#FCD34D"/>
  <text x="366" y="175" class="ct">Directory + search</text>
  <text x="366" y="200" class="cx">Public: name, tags, description</text>
  <text x="366" y="220" class="cx">Private: opaque route ID only</text>
  <text x="366" y="240" class="cx">Signed · snapshots · replicated</text>

  <rect x="630" y="145" width="260" height="105" rx="10" fill="#FFFFFF" stroke="#FCD34D"/>
  <text x="646" y="175" class="ct">Relay registry</text>
  <text x="646" y="200" class="cx">Addresses, regions, capacity</text>
  <text x="646" y="220" class="cx">Signed heartbeats · open to all</text>
  <text x="646" y="240" class="cx">+ device-link nameplates</text>

  <rect x="910" y="145" width="260" height="105" rx="10" fill="#FFFFFF" stroke="#FCD34D"/>
  <text x="926" y="175" class="ct">DM file blob store</text>
  <text x="926" y="200" class="cx">age-encrypted files, by hash</text>
  <text x="926" y="220" class="cx">Deleted once fetched or after 72 h</text>
  <text x="926" y="240" class="cx">Not replicated (up to 2 copies)</text>

  <!-- Lookup / listing elbows (gray) -->
  <path d="M175,598 V300 H470 V274" fill="none" stroke="#64748B" stroke-width="1.75" stroke-dasharray="5 4" marker-end="url(#hGray)"/>
  <text x="200" y="293" class="al" fill="#475569">search · look up routes</text>
  <path d="M1110,598 V300 H530 V274" fill="none" stroke="#64748B" stroke-width="1.75" stroke-dasharray="5 4" marker-end="url(#hGray)"/>
  <text x="1095" y="293" class="al" fill="#475569" text-anchor="end">publish signed listing + route</text>

  <!-- DM mailbox arrow (purple) -->
  <line x1="105" y1="598" x2="105" y2="273" stroke="#7C3AED" stroke-width="2.5" marker-start="url(#tPurple)" marker-end="url(#hPurple)"/>
  <text x="93" y="436" class="al" fill="#6D28D9" text-anchor="middle" transform="rotate(-90 93 436)">DMs + files for offline devices (end-to-end)</text>

  <!-- ===================== RELAY LAYER ===================== -->
  <rect x="200" y="330" width="840" height="200" rx="16" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="220" y="357" class="zl" fill="#334155">RELAY LAYER</text>
  <text x="220" y="376" class="zs">Interchangeable topic routers · listed in the relay registry · hold no keys</text>

  <rect x="230" y="392" width="240" height="98" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="246" y="420" class="ct">Relay A</text>
  <text x="246" y="444" class="cx">Keyless SFU: call in #lounge</text>
  <text x="246" y="464" class="cx">Forwards SFrame media (UDP)</text>

  <rect x="500" y="392" width="240" height="98" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="516" y="420" class="ct">Relay B</text>
  <text x="516" y="444" class="cx">Tunnel to the community server</text>
  <text x="516" y="464" class="cx">Channels, files ≤ 25 MB, DMs</text>

  <rect x="770" y="392" width="240" height="98" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-dasharray="6 4"/>
  <text x="786" y="420" class="ct">Relay C</text>
  <text x="786" y="444" class="cx">Standby</text>
  <text x="786" y="464" class="cx">Takes over if A or B drops</text>

  <text x="620" y="514" class="zs" text-anchor="middle">Forward only  ·  no storage  ·  no accounts  ·  can't read anything</text>

  <!-- Trust zone <-> relays -->
  <line x1="350" y1="598" x2="350" y2="533" stroke="#DB2777" stroke-width="2.5" marker-start="url(#tPink)" marker-end="url(#hPink)"/>
  <text x="342" y="570" class="al" fill="#BE185D" text-anchor="end">voice · video · screen</text>

  <line x1="560" y1="598" x2="560" y2="533" stroke="#2563EB" stroke-width="2.5" marker-start="url(#tBlue)" marker-end="url(#hBlue)"/>
  <text x="552" y="570" class="al" fill="#1D4ED8" text-anchor="end">chat · files · live DMs</text>

  <line x1="700" y1="598" x2="700" y2="533" stroke="#2563EB" stroke-width="2.5" marker-start="url(#tBlue)" marker-end="url(#hBlue)"/>
  <text x="708" y="562" class="al" fill="#1D4ED8">dials out</text>
  <text x="708" y="578" class="al" fill="#64748B" font-weight="400">no open ports</text>

  <!-- ===================== COMMUNITY TRUST ZONE ===================== -->
  <rect x="40" y="600" width="1160" height="350" rx="16" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="60" y="627" class="zl" fill="#3730A3">COMMUNITY TRUST ZONE</text>
  <text x="60" y="646" class="zs">Members and their community's own server share the community's keys. Admins can read everything stored on their hardware.</text>

  <!-- Members -->
  <rect x="64" y="666" width="520" height="264" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="1.25"/>
  <text x="84" y="692" class="zl" fill="#065F46">MEMBERS</text>
  <text x="84" y="710" class="zs">Desktop app (QtWebEngine) · keys stay in Python, never in the page</text>

  <rect x="84" y="726" width="152" height="72" rx="10" fill="#FFFFFF" stroke="#6EE7B7"/>
  <text x="100" y="756" class="ct">Alice</text>
  <text x="100" y="778" class="cx">owner · admin</text>
  <use href="#key" x="214" y="752"/>

  <rect x="248" y="726" width="152" height="72" rx="10" fill="#FFFFFF" stroke="#6EE7B7"/>
  <text x="264" y="756" class="ct">Bob</text>
  <text x="264" y="778" class="cx">moderator</text>
  <use href="#key" x="378" y="752"/>

  <rect x="412" y="726" width="152" height="72" rx="10" fill="#FFFFFF" stroke="#6EE7B7"/>
  <text x="428" y="756" class="ct">Carol</text>
  <text x="428" y="778" class="cx">member</text>
  <use href="#key" x="542" y="752"/>

  <circle cx="88" cy="830" r="2.5" fill="#10B981"/>
  <text x="98" y="834" class="cx">Login = a keypair the user generates</text>
  <circle cx="88" cy="852" r="2.5" fill="#10B981"/>
  <text x="98" y="856" class="cx">New keypair per community by default (no cross-community ID)</text>
  <circle cx="88" cy="874" r="2.5" fill="#10B981"/>
  <text x="98" y="878" class="cx">Link devices with a short code (SPAKE2) · encrypted backups</text>
  <circle cx="88" cy="896" r="2.5" fill="#10B981"/>
  <text x="98" y="900" class="cx">DMs: Olm/Megolm to every device · signed device lists</text>

  <!-- Community server -->
  <rect x="656" y="666" width="520" height="264" rx="12" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.25"/>
  <text x="676" y="696" class="ct" font-size="16">Community server</text>
  <use href="#key" x="1150" y="691"/>
  <text x="676" y="715" class="zs">Home network or VPS · run by the community · no open ports</text>

  <circle cx="680" cy="740" r="2.5" fill="#6366F1"/>
  <text x="690" y="744" class="cx">Member roll: public keys + roles</text>
  <circle cx="680" cy="762" r="2.5" fill="#6366F1"/>
  <text x="690" y="766" class="cx">Issues and revokes join keys</text>
  <circle cx="680" cy="784" r="2.5" fill="#6366F1"/>
  <text x="690" y="788" class="cx">Stores (encrypted at rest) and searches content</text>
  <circle cx="680" cy="806" r="2.5" fill="#6366F1"/>
  <text x="690" y="810" class="cx">Retention set by the community (short by default)</text>
  <circle cx="680" cy="828" r="2.5" fill="#6366F1"/>
  <text x="690" y="832" class="cx">Hands out channel keys · runs calls (grants, call keys)</text>
  <circle cx="680" cy="850" r="2.5" fill="#6366F1"/>
  <text x="690" y="854" class="cx">Owner keys (several) certify it and can move it</text>

  <rect x="676" y="874" width="480" height="36" rx="18" fill="#E0E7FF"/>
  <text x="916" y="897" font-size="13" font-weight="600" fill="#3730A3" text-anchor="middle">Admins can read everything stored here · never DMs</text>

  <!-- ===================== LEGEND ===================== -->
  <rect x="40" y="970" width="1160" height="96" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>

  <line x1="64" y1="996" x2="100" y2="996" stroke="#2563EB" stroke-width="2.5"/>
  <text x="110" y="1000" class="lg">Community traffic (community keys)</text>

  <line x1="350" y1="996" x2="386" y2="996" stroke="#DB2777" stroke-width="2.5"/>
  <text x="396" y="1000" class="lg">Calls (SFrame, per-call keys)</text>

  <line x1="640" y1="996" x2="676" y2="996" stroke="#7C3AED" stroke-width="2.5"/>
  <text x="686" y="1000" class="lg">DMs (end-to-end, participants only)</text>

  <line x1="930" y1="996" x2="966" y2="996" stroke="#64748B" stroke-width="1.75" stroke-dasharray="5 4"/>
  <text x="976" y="1000" class="lg">Public lookups and listings</text>

  <use href="#key" x="76" y="1036"/>
  <text x="96" y="1040" class="lg">Keys live with members and their community server (community traffic) or with DM participants (DMs). Relays and maintainer nodes hold none.</text>
</svg>
